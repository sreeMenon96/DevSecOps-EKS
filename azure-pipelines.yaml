trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: AWS-Variables

  - name: IMAGE_NAME
    value: devsecops-app

  - name: IMAGE_TAG
    value: $(Build.BuildId)

stages:

  - stage: CI
    displayName: "Continuous Integration"

    jobs:

      - job: BuildAndScan
        displayName: "Build, Scan and Publish"

        steps:

          - checkout: self

          - task: NodeTool@0
            displayName: Install Node.js

            inputs:
              versionSpec: '20.x'

          - script: |
              chmod +x scripts/*.sh
            displayName: Give Execute Permission

          - script: |
              ./scripts/build.sh
            displayName: Build Application

          - script: |
              ./scripts/install-trivy.sh
            displayName: Install Trivy

          - script: |
              ./scripts/scan-image.sh
            displayName: Scan Docker Image

          - script: |
              ./scripts/install-aws-cli.sh
            displayName: Install AWS CLI

          - script: |
              ./scripts/push-ecr.sh
            displayName: Push Docker Image to Amazon ECR
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_REGION: $(AWS_REGION)
              AWS_ACCOUNT_ID: $(AWS_ACCOUNT_ID)
              ECR_REPOSITORY: $(ECR_REPOSITORY)
              IMAGE_NAME: $(IMAGE_NAME)
              IMAGE_TAG: $(IMAGE_TAG)
  - stage: CD
    displayName: "Continuous Deployment"

    dependsOn: CI
    condition: succeeded()

    jobs:

    - job: DeployToEKS
      displayName: "Deploy to Amazon EKS"

      steps:
        
        - checkout: self

        - script: |
            chmod +x scripts/*.sh
          displayName: Give Execute Permission

        - script: |
            ./scripts/install-aws-cli.sh
          displayName: Install AWS CLI

        - script: |
            ./scripts/install-kubectl.sh
          displayName: Install kubectl

        - script: |
            ./scripts/install-helm.sh
          displayName: Install Helm

        - script: |
            ./scripts/deploy.sh
          displayName: Configure EKS Cluster
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_REGION: $(AWS_REGION)
            EKS_CLUSTER_NAME: $(EKS_CLUSTER_NAME)
